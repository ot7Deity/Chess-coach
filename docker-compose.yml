# Local development: Postgres and Redis, plus the app behind a profile.
#
#   docker compose up -d                  Postgres and Redis only (the default)
#   docker compose --profile app up -d    ...plus migrations, the API and a worker
#   docker compose --profile app up -d --scale worker=4
#   docker compose ps                     show health, not just "running"
#   docker compose down                   stop everything, keep the data
#   docker compose down -v                ...and delete the data
#
# The app services are behind the `app` profile so that the plain
# `docker compose up -d` everyone already runs keeps meaning "infrastructure
# only" - the tests and host-run workers need Postgres and Redis, not a second
# copy of the app competing for the same queue.
#
# Credentials are the ones in .env.example. They are development-only and
# deliberately boring; nothing here is reachable from outside the machine.

name: chess-coach

services:
  postgres:
    # Pinned to the same major version CI uses. The queue's correctness rests on
    # version-specific locking behaviour (SELECT ... FOR UPDATE SKIP LOCKED),
    # and "passes locally, fails in CI" is the failure mode this project can
    # least afford to introduce on purpose.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      # Matches DATABASE_URL in .env.example.
      POSTGRES_DB: chess_coach
    ports:
      # Set POSTGRES_PORT in .env if something already owns 5432 on this machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only while initialising an empty data directory. Creates the
      # separate test database - see the init script for why it has to be
      # separate.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `docker compose up -d` returns as soon as containers start, which is
      # several seconds before Postgres accepts connections. With a healthcheck,
      # `docker compose ps` reports readiness honestly, and the app services
      # added in M2 can gate on `condition: service_healthy` instead of
      # sleeping and hoping.
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # Redis holds the shared rate-limiter token bucket and the hot position
      # cache. Both are rebuildable - Postgres is the source of truth - so this
      # volume is a convenience, not a correctness requirement. It is here so
      # that restarting Docker does not throw away a warm cache mid-benchmark.
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- the app (profile: app) ----------------------------------------------
  # One image for all three. The API and migrations never run the engine, so
  # they skip the Stockfish installer; only the worker runs it.

  migrate:
    profiles: ["app"]
    build: .
    image: chess-coach:dev
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chess_coach
      REDIS_URL: redis://redis:6379/0
      ENV: docker
      FETCH_STOCKFISH: "0"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: chess-coach:dev
    environment: *app-env
    command: ["uvicorn", "chess_coach.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: chess-coach:dev
    environment:
      <<: *app-env
      # The entrypoint probes THIS machine's CPU and installs the fastest
      # Stockfish build that actually runs here, into the vendor volume. Never
      # at build time: an image is copied to machines with different CPUs.
      FETCH_STOCKFISH: "1"
      ENGINE_DEPTH: ${ENGINE_DEPTH:-16}
    command: ["chess-coach-worker"]
    volumes:
      # Shared by every worker replica, so the ~80 MB download happens once
      # per machine; the entrypoint serialises the installer with flock.
      - vendor:/app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM finishes the current game before exiting; give it time to.
    stop_grace_period: 60s
    restart: unless-stopped

  sync-worker:
    profiles: ["app"]
    image: chess-coach:dev
    environment:
      <<: *app-env
      # Chess.com asks for a contactable User-Agent; set it in .env.
      CHESSCOM_CONTACT: ${CHESSCOM_CONTACT:-you@example.com}
    # sync-player jobs (queued by POST /players). No engine needed. One is
    # enough: every sync worker shares one Redis rate limit of 1 request/s.
    command: ["chess-coach-worker", "--kind", "sync"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  vendor:
